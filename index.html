<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RainMap | Rainfall Monitor</title>

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f6fb;
      color: #19324a;
    }

    header {
      background: #1769aa;
      color: white;
      padding: 24px 20px;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #173b5b12;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 16px;
      border: 1px solid #d5e2ee;
      background: white;
      color: #19324a;
    }

    button {
      background: #1769aa;
      color: white;
      border: none;
      margin-top: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #125182;
    }

    .rain-number {
      font-size: 36px;
      font-weight: 700;
      color: #1769aa;
      margin: 10px 0;
    }

    .muted {
      color: #72859a;
      font-size: 13px;
    }

    #map {
      height: 320px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    #chart {
      width: 100%;
      height: 180px;
    }

    .status {
      padding: 10px;
      border-radius: 10px;
      background: #eaf4ff;
      margin-top: 12px;
      font-size: 14px;
    }

    .hour-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #edf1f5;
      font-size: 14px;
    }

    /* Legend Control on Map */
    .map-legend {
      background: white;
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      line-height: 1.5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #72859a;
      font-size: 12px;
    }
  </style>

  <!-- Chart.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body>

<header>
  <h1>🌧️ RainMap</h1>
  <p>ติดตามปริมาณน้ำฝนรายพื้นที่</p>
</header>

<main>

  <!-- Location -->
  <section class="card">
    <label for="location">
      เลือกพื้นที่ที่ต้องการตรวจสอบ
    </label>

    <select id="location">
      <option value="13.7563,100.5018">กรุงเทพมหานคร</option>
      <option value="18.7883,98.9853">เชียงใหม่</option>
      <option value="16.4322,102.8236">ขอนแก่น</option>
      <option value="7.8804,98.3923">ภูเก็ต</option>
      <option value="14.9799,102.0978">นครราชสีมา</option>
    </select>

    <button id="refresh">
      ตรวจสอบปริมาณน้ำฝน
    </button>
  </section>

  <!-- Rain Summary -->
  <section class="card">
    <p class="muted">ปริมาณฝนสะสม 24 ชั่วโมง</p>

    <div class="rain-number" id="totalRain">
      -- มม.
    </div>

    <p id="rainStatus">
      กำลังโหลดข้อมูล...
    </p>

    <div class="status" id="updated">
      รอการอัปเดตข้อมูล
    </div>
  </section>

  <!-- Map -->
  <section class="card">
    <h3>แผนที่พื้นที่ตรวจสอบ</h3>
    <div id="map"></div>
  </section>

  <!-- Chart -->
  <section class="card">
    <h3>ปริมาณน้ำฝนรายชั่วโมง</h3>
    <canvas id="chart"></canvas>
    <p class="muted">
      แสดงข้อมูลฝนรายชั่วโมงย้อนหลังและช่วงพยากรณ์
    </p>
  </section>

  <!-- Hourly Data -->
  <section class="card">
    <h3>ข้อมูลรายชั่วโมง</h3>
    <div id="hourlyList">
      กำลังโหลดข้อมูล...
    </div>
  </section>

</main>

<footer>
  RainMap Student Innovation Project
  <br>
  ข้อมูลจาก Open-Meteo
</footer>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const locationSelect = document.getElementById("location");
  const totalRain = document.getElementById("totalRain");
  const rainStatus = document.getElementById("rainStatus");
  const updated = document.getElementById("updated");
  const hourlyList = document.getElementById("hourlyList");

  // Initialize Map
  const map = L.map("map").setView([13.7563, 100.5018], 8);

  // RainMap Base Map - Esri
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Tiles &copy; Esri and its contributors",
      maxZoom: 19
    }
  ).addTo(map);

  const marker = L.marker([13.7563, 100.5018]).addTo(map);
  let rainCircle = null; // ตัวแปรสำหรับวงกลมแสดงระดับฝน
  let rainfallChart = null;

  // ฟังก์ชันกำหนดสีและชื่อระดับน้ำฝน
  function getRainInfo(mm) {
    if (mm === 0) {
      return { label: "ไม่มีฝนในข้อมูลช่วงนี้", color: "#28a745" }; // เขียว
    }
    if (mm < 10) {
      return { label: "ฝนเล็กน้อย", color: "#17a2b8" }; // ฟ้า
    }
    if (mm < 35) {
      return { label: "ฝนปานกลาง", color: "#ffc107" }; // เหลือง
    }
    if (mm < 90) {
      return { label: "ฝนหนัก", color: "#fd7e14" }; // ส้ม
    }
    return { label: "ฝนหนักมาก", color: "#dc3545" }; // แดง
  }

  // Add Legend to Map
  const legend = L.control({ position: "bottomright" });
  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "map-legend");
    div.innerHTML = `
      <strong>ระดับปริมาณฝน</strong>
      <div class="legend-item"><span class="legend-color" style="background:#28a745"></span>ไม่มีฝน</div>
      <div class="legend-item"><span class="legend-color" style="background:#17a2b8"></span>ฝนเล็กน้อย (&lt;10 มม.)</div>
      <div class="legend-item"><span class="legend-color" style="background:#ffc107"></span>ฝนปานกลาง (&lt;35 มม.)</div>
      <div class="legend-item"><span class="legend-color" style="background:#fd7e14"></span>ฝนหนัก (&lt;90 มม.)</div>
      <div class="legend-item"><span class="legend-color" style="background:#dc3545"></span>ฝนหนักมาก (90+ มม.)</div>
    `;
    return div;
  };
  legend.addTo(map);

  // Load Rain Data
  async function loadRain() {
    try {
      updated.textContent = "กำลังดึงข้อมูล...";

      const [lat, lon] = locationSelect.value.split(",");

      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + lat +
        "&longitude=" + lon +
        "&hourly=precipitation" +
        "&past_days=1" +
        "&forecast_days=1" +
        "&timezone=Asia%2FBangkok";

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("API request failed");
      }

      const data = await response.json();

      const times = data.hourly.time;
      const rain = data.hourly.precipitation;

      const now = new Date();

      // Find the last 24 hours
      const past24 = [];

      for (let i = 0; i < times.length; i++) {
        const time = new Date(times[i]);
        const difference = (now - time) / (1000 * 60 * 60);

        if (difference >= 0 && difference < 24) {
          past24.push(rain[i] || 0);
        }
      }

      const sum24 = past24.reduce((sum, value) => sum + value, 0);
      const rainInfo = getRainInfo(sum24);

      totalRain.textContent = sum24.toFixed(1) + " มม.";
      totalRain.style.color = rainInfo.color; // เปลี่ยนสีตัวเลขตามระดับฝน
      rainStatus.textContent = rainInfo.label;

      updated.textContent = "อัปเดตเมื่อ " + now.toLocaleString("th-TH");

      // Update Map View & Marker
      map.setView([lat, lon], 10);
      marker.setLatLng([lat, lon]);
      marker.bindPopup("<b>" + rainInfo.label + "</b><br>ปริมาณฝนสะสม 24 ชม.: " + sum24.toFixed(1) + " มม.");

      // ลบวงกลมเก่าทิ้ง (ถ้ามี) แล้วสร้างวงกลมใหม่ตามสีระดับฝน
      if (rainCircle) {
        map.removeLayer(rainCircle);
      }
      rainCircle = L.circle([lat, lon], {
        color: rainInfo.color,
        fillColor: rainInfo.color,
        fillOpacity: 0.35,
        radius: 12000 // รัศมีวงกลม 12 กิโลเมตร
      }).addTo(map);

      // Show hourly data
      hourlyList.innerHTML = "";

      const upcoming = [];

      for (let i = 0; i < times.length; i++) {
        if (new Date(times[i]) >= now) {
          upcoming.push(i);
        }

        if (upcoming.length === 6) {
          break;
        }
      }

      upcoming.forEach(index => {
        const row = document.createElement("div");
        row.className = "hour-row";

        const time = new Date(times[index]);

        row.innerHTML =
          "<span>" +
          time.toLocaleTimeString("th-TH", {
            hour: "2-digit",
            minute: "2-digit"
          }) +
          "</span>" +
          "<strong>" +
          (rain[index] || 0).toFixed(1) +
          " มม.</strong>";

        hourlyList.appendChild(row);
      });

      // Update Chart
      const chartLabels = times.slice(0, 24);
      const chartData = rain.slice(0, 24);

      if (rainfallChart) {
        rainfallChart.destroy();
      }

      rainfallChart = new Chart(
        document.getElementById("chart"),
        {
          type: "bar",
          data: {
            labels: chartLabels.map(time =>
              new Date(time).toLocaleTimeString(
                "th-TH",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              )
            ),
            datasets: [{
              label: "ปริมาณฝน (มม.)",
              data: chartData,
              backgroundColor: rainInfo.color, // ให้สีแท่งกราฟสอดคล้องกับระดับฝนด้วย
              borderRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true
              }
            },
            plugins: {
              legend: {
                display: false
              }
            }
          }
        }
      );

    } catch (error) {
      console.error(error);
      updated.textContent = "ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่";
      rainStatus.textContent = "ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต";
    }
  }

  // Button Events
  document.getElementById("refresh").addEventListener("click", loadRain);
  locationSelect.addEventListener("change", loadRain);

  // Start App
  loadRain();
</script>

</body>
</html>
